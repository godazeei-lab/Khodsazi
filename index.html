<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef, memo, useCallback } = React;

// ============================================================
// 🔥 Firebase Config
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBSt_xLWNyMKtaPSrqTPEBB3R6Oj2LgHV4",
  authDomain: "khodsazi.firebaseapp.com",
  projectId: "khodsazi",
  storageBucket: "khodsazi.firebasestorage.app",
  messagingSenderId: "856900594491",
  appId: "1:856900594491:web:d0592d1eed8eba9eb1251e",
  measurementId: "G-2NTVWZKBVF"
};

let auth, db;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  db.enablePersistence().catch(() => {});
} catch (err) {
  console.error('Firebase init error:', err);
}

// ============================================================
// 📌 کامپوننت ورود
// ============================================================
const Login = ({ onLogin }) => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [savedEmail, setSavedEmail] = useState('');

  useEffect(() => {
    const saved = localStorage.getItem('savedLoginEmail');
    if (saved) {
      setSavedEmail(saved);
      setEmail(saved);
    }
  }, []);

  const handleLogin = async () => {
    setLoading(true); setError('');
    try {
      await auth.signInWithEmailAndPassword(email, password);
      localStorage.setItem('savedLoginEmail', email);
      onLogin();
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleRegister = async () => {
    setLoading(true); setError('');
    try {
      await auth.createUserWithEmailAndPassword(email, password);
      localStorage.setItem('savedLoginEmail', email);
      onLogin();
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleGoogleLogin = async () => {
    setLoading(true); setError('');
    try {
      await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      localStorage.setItem('savedLoginEmail', email || 'google-user');
      onLogin();
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  const useSavedEmail = () => {
    if (savedEmail) {
      setEmail(savedEmail);
      document.getElementById('password-input')?.focus();
    }
  };

  return (
    <div className="login-box card">
      <h2>🔐 ورود / ثبت‌نام</h2>
      {savedEmail && (
        <div className="saved-info" onClick={useSavedEmail}>
          🔄 ورود با ایمیل قبلی: <strong>{savedEmail}</strong> (کلیک کنید)
        </div>
      )}
      <input type="email" placeholder="ایمیل" value={email} onChange={(e) => setEmail(e.target.value)} disabled={loading} />
      <input id="password-input" type="password" placeholder="رمز عبور" value={password} onChange={(e) => setPassword(e.target.value)} disabled={loading} onKeyDown={(e) => e.key === 'Enter' && handleLogin()} />
      {error && <div className="error">{error}</div>}
      <div className="btn-row">
        <button className="btn btn-blue" onClick={handleLogin} disabled={loading}>ورود</button>
        <button className="btn btn-green" onClick={handleRegister} disabled={loading}>ثبت‌نام</button>
      </div>
      <button className="btn btn-google" onClick={handleGoogleLogin} disabled={loading} style={{ marginTop: '12px', width: '100%' }}>🚀 ورود با گوگل</button>
    </div>
  );
};

// ============================================================
// 🧠 توابع کمکی
// ============================================================
const handleNamazShab = (val) => { const n=Number(val); if(n>=10)return 10; if(n>=5)return 5; return 0; };
const handleNamazAval = (val) => { const n=Number(val); if(n>=15)return 15; if(n>=10)return 10; if(n>=5)return 5; return 0; };
const handleKhahesh = (val) => { const n=Number(val); if(n>=10)return 10; if(n>=5)return 5; return 0; };

const getDefaultItems = () => ({
  scientific: [
    { id: 'preStudy', label: 'پیش مطالعه', type: 'checkbox', field: 'preStudy', score: 15, nature: 'normal', conditional: false },
    { id: 'studyDailySameDay', label: 'مطالعه همان روز', type: 'slider', field: 'studyDailySameDay', min: 0, max: 40, step: 1, score: 0, nature: 'normal', conditional: false },
    { id: 'stabilization', label: 'تثبیت مطالب', type: 'checkbox', field: 'stabilization', score: 10, nature: 'normal', conditional: false },
    { id: 'discussion', label: 'مباحثه', type: 'toggleWithSlider', field: 'discussionOn', scoreField: 'discussionScore', min: 0, max: 30, step: 1, nature: 'normal', conditional: true },
    { id: 'hafziat', label: 'حفظیات', type: 'slider', field: 'hafziat', min: 0, max: 5, step: 1, score: 0, nature: 'normal', conditional: false }
  ],
  tahzib: [
    { id: 'lang', label: 'کنترل زبان', type: 'penaltyCounter', field: 'lang', maxScore: 10, nature: 'normal', conditional: false },
    { id: 'look', label: 'کنترل چشم', type: 'penaltyCounter', field: 'look', maxScore: 10, nature: 'normal', conditional: false },
    { id: 'khahesh', label: 'خواهش نفسانی', type: 'slider', field: 'khahesh', min: 0, max: 10, step: 5, score: 0, nature: 'normal', conditional: false, extra: '۰،۵،۱۰', handler: handleKhahesh },
    { id: 'namazAval', label: 'نماز اول وقت', type: 'slider', field: 'namazAval', min: 0, max: 15, step: 5, score: 0, nature: 'normal', conditional: false, extra: '۰،۵،۱۰،۱۵', handler: handleNamazAval },
    { id: 'namazShab', label: 'نماز شب', type: 'slider', field: 'namazShab', min: 0, max: 10, step: 5, score: 0, nature: 'normal', conditional: false, extra: '۰،۵،۱۰', handler: handleNamazShab },
    { id: 'ziyarat', label: 'زیارت عاشورا', type: 'checkbox', field: 'ziyarat', score: 5, nature: 'normal', conditional: false },
    { id: 'hadisKesa', label: 'حدیث کسا', type: 'checkbox', field: 'hadisKesa', score: 5, nature: 'normal', conditional: false },
    { id: 'sora', label: 'سوره فتح', type: 'checkbox', field: 'sora', score: 5, nature: 'normal', conditional: false },
    { id: 'tasbihat', label: 'تسبیحات حضرت', type: 'checkbox', field: 'tasbihat', score: 5, nature: 'normal', conditional: false },
    { id: 'eghame', label: 'اقامه', type: 'checkbox', field: 'eghame', score: 5, nature: 'normal', conditional: false },
    { id: 'azan', label: 'پوشیدن عبا', type: 'checkbox', field: 'azan', score: 5, nature: 'normal', conditional: false },
    { id: 'mohasebeNafs', label: 'محاسبه نفس', type: 'checkbox', field: 'mohasebeNafs', score: 10, nature: 'normal', conditional: false },
    { id: 'adayeDin', label: 'ادای دِین (۵ امتیاز)', type: 'adayeDin', field: 'adayeDinOn', nature: 'normal', conditional: false }
  ],
  basirat: [
    { id: 'motaleah', label: 'مطالعه بصیرتی', type: 'slider', field: 'motaleah', min: 0, max: 25, step: 1, score: 0, nature: 'normal', conditional: false },
    { id: 'socialPresence', label: '۱) حضور در اجتماع', type: 'checkbox', field: 'socialPresence', score: 10, nature: 'normal', conditional: false },
    { id: 'majazi', label: 'فعالیت مجازی', type: 'slider', field: 'majazi', min: 0, max: 10, step: 5, score: 0, nature: 'normal', conditional: false, extra: '۰،۵،۱۰', handler: handleKhahesh },
    { id: 'goal', label: 'هدف‌گذاری', type: 'checkbox', field: 'goal', score: 5, nature: 'normal', conditional: false },
    { id: 'leadershipSpeech', label: 'تحلیل سخنان رهبری', type: 'checkbox', field: 'leadershipSpeech', score: 10, nature: 'normal', conditional: false }
  ],
  organization: [
    { id: 'sleepQuality', label: 'کیفیت خواب', type: 'slider', field: 'sleepQuality', min: 0, max: 10, step: 1, score: 0, nature: 'normal', conditional: false },
    { id: 'phoneOrder', label: 'نظم در استفاده از گوشی', type: 'slider', field: 'phoneOrder', min: 0, max: 10, step: 1, score: 0, nature: 'normal', conditional: false },
    { id: 'sports', label: 'ورزش', type: 'slider', field: 'sports', min: 0, max: 10, step: 1, score: 0, nature: 'normal', conditional: false },
    { id: 'profession', label: 'یادگیری حرفه', type: 'slider', field: 'profession', min: 0, max: 10, step: 1, score: 0, nature: 'normal', conditional: false },
    { id: 'brush', label: 'مسواک', type: 'checkbox', field: 'brush', score: 10, nature: 'normal', conditional: false }
  ]
});

let idCounter = 1000;
const genId = () => `item_${idCounter++}`;

const mergeItems = (defaultItems, savedItems) => {
  if (!savedItems || Object.keys(savedItems).length === 0) return defaultItems;
  const result = {};
  Object.keys(defaultItems).forEach(section => {
    const defaultSection = defaultItems[section] || [];
    const savedSection = savedItems[section] || [];
    const savedMap = {};
    savedSection.forEach(item => { if (item.id) savedMap[item.id] = item; });
    const merged = defaultSection.map(defaultItem => {
      const savedItem = savedMap[defaultItem.id];
      return savedItem ? { ...defaultItem, ...savedItem } : { ...defaultItem };
    });
    const extraItems = savedSection.filter(item => !defaultSection.some(d => d.id === item.id));
    result[section] = [...merged, ...extraItems];
  });
  return result;
};

// ============================================================
// 🧮 توابع محاسبه امتیاز
// ============================================================
const calcSectionScore = (state, items) => {
  let score = 0, max = 0;
  const getVal = (field) => state[field] || 0;
  items.forEach(item => {
    if (item.type === 'checkbox') {
      if (state[item.field]) score += item.score;
      if (item.nature === 'normal' && (!item.conditional || state[item.field])) max += item.score;
    } else if (item.type === 'toggleWithCheckbox') {
      if (state[item.field]) {
        if (item.nature === 'normal') max += item.score;
        if (state[item.scoreField]) score += item.score;
      }
    } else if (item.type === 'slider') {
      score += getVal(item.field);
      if (item.nature === 'normal' && (!item.conditional || state[item.field])) max += item.max || 0;
    } else if (item.type === 'toggleWithSlider') {
      if (state[item.field]) { const val = getVal(item.scoreField); score += val; if (item.nature === 'normal') max += item.max || 0; }
    } else if (item.type === 'penaltyCounter') {
      score += getVal(item.field);
      if (item.nature === 'normal') max += item.maxScore || 10;
    } else if (item.type === 'adayeDin') {
      if (state[item.field]) { const any = state.namazSobh || state.namazZohr || state.namazAsr || state.namazMaghreb || state.namazEsha || state.rooze; if (any) score += 5; }
      if (item.nature === 'normal' && (!item.conditional || state[item.field])) max += 5;
    }
  });
  return { score, max };
};

const generateCode = (state) => {
  const s = state;
  const sci = `S${s.preStudy?15:0}T${s.studyDailySameDay}D${s.stabilization?10:0}M${s.discussionOn?1:0}_${s.discussionScore}H${s.hafziat}`;
  const tah = `L${s.lang}Lk${s.look}K${s.khahesh}N${s.namazAval}N${s.namazShab}Z${s.ziyarat?1:0}Hk${s.hadisKesa?1:0}S${s.sora?1:0}T${s.tasbihat?1:0}E${s.eghame?1:0}A${s.azan?1:0}Mh${s.mohasebeNafs?1:0}`;
  const ad = `Ad${s.adayeDinOn?1:0}${s.namazSobh?1:0}${s.namazZohr?1:0}${s.namazAsr?1:0}${s.namazMaghreb?1:0}${s.namazEsha?1:0}${s.rooze?1:0}`;
  const bas = `B${s.motaleah}P${s.socialPresence?1:0}M${s.majazi}Gd${s.goal?1:0}Ld${s.leadershipSpeech?1:0}`;
  const sleepSlots = s.sleepSlots || [];
  const sleepStr = sleepSlots.length === 0 ? '0' : sleepSlots.map(t => `${t.sleep.replace(':','')}-${t.wake.replace(':','')}`).join('_');
  const org = `O${s.sports}R${s.sleepQuality}Q${s.phoneOrder}Pr${s.profession}Br${s.brush?1:0}Sl${sleepStr}`;

  const sections = ['scientific', 'tahzib', 'basirat', 'organization'];
  const customItems = [];
  sections.forEach(section => {
    const items = s.items?.[section] || [];
    items.forEach(item => {
      if (item.id && item.id.startsWith('item_')) {
        let fieldValue = 0, scoreValue = 0;
        if (item.type === 'checkbox') { fieldValue = s[item.field] ? 1 : 0; scoreValue = fieldValue; }
        else if (item.type === 'slider') { fieldValue = s[item.field] || 0; scoreValue = fieldValue; }
        else if (item.type === 'penaltyCounter') { fieldValue = s[item.field] || 0; scoreValue = fieldValue; }
        else if (item.type === 'toggleWithCheckbox') { fieldValue = s[item.field] ? 1 : 0; scoreValue = s[item.scoreField] ? 1 : 0; }
        else if (item.type === 'toggleWithSlider') { fieldValue = s[item.field] ? 1 : 0; scoreValue = s[item.scoreField] || 0; }
        customItems.push({ section, ...item, fieldValue, scoreValue });
      }
    });
  });

  let customStr = '';
  if (customItems.length > 0) {
    const encoded = customItems.map(item => {
      const parts = [item.section, item.type || '', item.field || '', item.scoreField || '', item.score || 0, item.max || 0, item.nature || 'normal', item.conditional ? '1' : '0', item.label || '', item.fieldValue, item.scoreValue];
      return parts.join(':');
    }).join(';');
    customStr = `C${encoded}`;
  }
  const noteStr = s.note ? `N${encodeURIComponent(s.note)}` : '';
  return `${sci}|${tah}|${ad}|${bas}|${org}|${customStr}|${noteStr}`;
};

const createNewItem = (formData) => {
  const isConditional = formData.type === 'toggleWithSlider' || formData.type === 'toggleWithCheckbox';
  const base = { id: genId(), label: formData.label, type: formData.type, nature: formData.nature, conditional: isConditional };
  if (formData.type === 'checkbox' || formData.type === 'toggleWithCheckbox') {
    return { ...base, field: formData.field, score: parseInt(formData.score) || 0, scoreField: formData.type === 'toggleWithCheckbox' ? formData.scoreField : undefined };
  } else if (formData.type === 'slider') {
    return { ...base, field: formData.field, min: 0, max: parseInt(formData.maxScore) || 10, step: 1, score: 0 };
  } else if (formData.type === 'penaltyCounter') {
    return { ...base, field: formData.field, maxScore: parseInt(formData.maxScore) || 10 };
  } else {
    return { ...base, field: formData.field, scoreField: formData.scoreField, min: 0, max: parseInt(formData.maxScore) || 10, step: 1 };
  }
};

const extractDay = (d) => { if(!d)return ''; const p=d.split(/[\/ :]/); return p.length>=3 ? p[2] : d; };

const drawLine = (canvas, data, keys, colors, isPercent=false) => {
  if(!canvas||!data||data.length===0)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const pad={top:20,bottom:30,left:40,right:20};
  const cw=W-pad.left-pad.right, ch=H-pad.top-pad.bottom;
  let max=0; data.forEach(d=>{keys.forEach(k=>{if(d[k]>max)max=d[k];});});
  if(isPercent) max=100; else max=Math.max(max,10);
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){ const y=pad.top+ch-(i/4)*ch; ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke(); ctx.fillStyle='#64748b'; ctx.font='10px Vazirmatn'; ctx.textAlign='right'; const v=Math.round((i/4)*max); ctx.fillText(isPercent?v+'%':v, pad.left-5, y+3); }
  keys.forEach((key,idx)=>{
    const color=colors[idx%colors.length];
    ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath(); let first=true;
    data.forEach((d,i)=>{ const x=pad.left+(i/(data.length-1||1))*cw; const y=pad.top+ch-(d[key]/max)*ch; if(first){ctx.moveTo(x,y); first=false;}else ctx.lineTo(x,y); });
    ctx.stroke();
    data.forEach((d,i)=>{ const x=pad.left+(i/(data.length-1||1))*cw; const y=pad.top+ch-(d[key]/max)*ch; ctx.beginPath(); ctx.arc(x,y,5,0,2*Math.PI); ctx.fillStyle=color; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke(); });
  });
  ctx.fillStyle='#64748b'; ctx.font='10px Vazirmatn'; ctx.textAlign='center';
  data.forEach((d,i)=>{ const x=pad.left+(i/(data.length-1||1))*cw; ctx.fillText(extractDay(d.date), x, H-5); });
  let lx=W-60, ly=10;
  keys.forEach((key,idx)=>{ ctx.fillStyle=colors[idx%colors.length]; ctx.fillRect(lx,ly,12,12); ctx.fillStyle='#1e293b'; ctx.font='9px Vazirmatn'; ctx.textAlign='left'; ctx.fillText(key, lx+18, ly+10); ly+=20; });
};

const CheckboxItem = memo(({ label, score, checked, onChange, bonus, penalty }) => (
  <div className="item"><label><input type="checkbox" checked={checked} onChange={onChange} /> {label} {bonus && <span className="bonus">تشویقی</span>}{penalty && <span className="penalty">منفی</span>}</label><span className="score-tag">{score >= 0 ? '+' : ''}{score}</span></div>
));

const SliderItem = memo(({ label, min, max, step, val, onChange, extra, nature }) => (
  <div className="slider-wrap"><div className="label-row"><span>{label} {nature === 'bonus' && <span className="bonus" style={{marginRight:'8px'}}>تشویقی</span>}{nature === 'penalty' && <span className="penalty" style={{marginRight:'8px'}}>منفی</span>}{extra && <span className="text-sm text-indigo-500" style={{marginRight:'4px'}}>({extra})</span>}</span><span className="val">{val}</span></div><input type="range" min={min} max={max} step={step} value={val} onChange={onChange} /></div>
));

const PenaltyCounter = memo(({ label, value, maxScore, onChange }) => {
  const usedCount = maxScore - value;
  const squares = [];
  for (let i = 0; i < maxScore; i++) {
    const isUsed = i < usedCount;
    squares.push(
      <div key={i} className={`penalty-square ${isUsed ? 'used' : ''}`} onClick={() => { if (isUsed) return; if (value > 0) onChange(value - 1); }} title={isUsed ? 'استفاده شده' : 'کلیک کنید تا ۱ امتیاز کم شود'}>
        {isUsed ? '−' : ''}
      </div>
    );
  }
  return (
    <div className="slider-wrap" style={{ padding: '12px 4px' }}>
      <div className="label-row" style={{ marginBottom: '8px' }}>
        <span style={{ fontWeight: 700 }}>{label}</span>
        <span className="val" style={{ fontWeight: 700, color: '#2563eb' }}>{value} از {maxScore}</span>
      </div>
      <div className="penalty-box">
        <span className="penalty-label">خطا:</span>
        {squares}
        <div className="penalty-restore" onClick={() => { if (value < maxScore) onChange(value + 1); }} title="برگرداندن یک امتیاز">➕</div>
      </div>
    </div>
  );
});

const SleepSlotManager = ({ slots, onChange }) => {
  const addSlot = () => { if (slots.length >= 3) return; onChange([...slots, { sleep: '13:00', wake: '14:00' }]); };
  const removeSlot = (index) => { if (slots.length <= 1) return; onChange(slots.filter((_, i) => i !== index)); };
  const updateSlot = (index, field, value) => { const newSlots = [...slots]; newSlots[index][field] = value; onChange(newSlots); };
  return (
    <div className="sleep-slot-manager">
      {slots.map((item, index) => (
        <div key={index} className="sleep-slot-item">
          <input type="time" value={item.sleep} onChange={(e) => updateSlot(index, 'sleep', e.target.value)} />
          <span> → </span>
          <input type="time" value={item.wake} onChange={(e) => updateSlot(index, 'wake', e.target.value)} />
          {index > 0 && <button onClick={() => removeSlot(index)}>✖</button>}
        </div>
      ))}
      {slots.length < 3 && <button className="add-slot-btn" onClick={addSlot}>➕</button>}
    </div>
  );
};

const App = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [state, setState] = useState(() => getDefaultState());
  const [reports, setReports] = useState([]);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [editingReportId, setEditingReportId] = useState(null);

  const saveToFirestore = useCallback(async (userId, newState, newReports) => {
    if (!userId || !db) return;
    try {
      await db.collection('users').doc(userId).set({ state: newState, reports: newReports, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    } catch (err) { console.error('Save error:', err); }
  }, []);

  useEffect(() => {
    if (!auth) { setError('Firebase مقداردهی نشد.'); setLoading(false); return; }
    const timeout = setTimeout(() => setLoading(false), 5000);
    const unsubscribe = auth.onAuthStateChanged(
      (u) => { setUser(u); setLoading(false); clearTimeout(timeout); if (u) setDataLoaded(true); },
      (err) => { setError(err.message); setLoading(false); clearTimeout(timeout); }
    );
    return () => { unsubscribe(); clearTimeout(timeout); };
  }, []);

  useEffect(() => {
    if (!user || !db) return;
    const unsubscribe = db.collection('users').doc(user.uid).onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        if (data.state) {
          const defaultState = getDefaultState();
          const mergedItems = mergeItems(defaultState.items, data.state.items);
          setState({ ...defaultState, ...data.state, items: mergedItems, sleepSlots: data.state.sleepSlots || [{ sleep: '23:00', wake: '07:00' }], note: data.state.note || '' });
        }
        if (data.reports) setReports(data.reports);
      } else {
        const defaultState = getDefaultState();
        setState(defaultState); setReports([]);
        saveToFirestore(user.uid, defaultState, []);
      }
      setDataLoaded(true);
    }, (err) => { setError(err.message); });
    return () => unsubscribe();
  }, [user, saveToFirestore]);

  useEffect(() => {
    if (!user || !dataLoaded || !db) return;
    const timeout = setTimeout(() => { saveToFirestore(user.uid, state, reports); }, 500);
    return () => clearTimeout(timeout);
  }, [state, reports, user, dataLoaded, saveToFirestore]);

  const update = useCallback((k, v) => setState(p => ({ ...p, [k]: v })), []);
  const [open, setOpen] = useState({ scientific: false, tahzib: false, basirat: false, organization: false });
  const toggle = useCallback((s) => setOpen(p => ({ ...p, [s]: !p[s] })), []);
  const [editMode, setEditMode] = useState({ scientific: false, tahzib: false, basirat: false, organization: false });
  const toggleEdit = useCallback((section) => setEditMode(p => ({ ...p, [section]: !p[section] })), []);
  const [showAddModal, setShowAddModal] = useState(false);
  const [addTarget, setAddTarget] = useState(null);
  const openAddModal = useCallback((section) => { setAddTarget(section); setShowAddModal(true); }, []);
  const handleAddItem = useCallback((item, field, scoreField) => {
    if (!addTarget) return;
    const items = [...state.items[addTarget], item];
    update('items', { ...state.items, [addTarget]: items });
    if (item.type === 'checkbox' || item.type === 'toggleWithCheckbox') {
      update(field, false);
      if (item.type === 'toggleWithCheckbox') update(scoreField, false);
    } else if (item.type === 'slider') { update(field, 0); }
    else if (item.type === 'penaltyCounter') { update(field, item.maxScore || 10); }
    else { update(field, false); update(scoreField, 0); }
  }, [addTarget, state.items, update]);

  const moveItem = useCallback((section, index, direction) => {
    const items = [...state.items[section]];
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= items.length) return;
    [items[index], items[newIndex]] = [items[newIndex], items[index]];
    update('items', { ...state.items, [section]: items });
  }, [state.items, update]);

  const deleteItem = useCallback((section, index, itemId) => {

    if (!item) return;
    if (window.confirm(`آیا از حذف "${item.label}" مطمئن هستید؟`)) {

      update('items', { ...state.items, [section]: items });

      const editIndex = reports.findIndex(r => r.id === editingReportId);

          },

            adayeDin: { enabled: state.adayeDinOn, sobh: state.namazSobh, zohr: state.namazZohr, asr: state.namazAsr, maghreb: state.namazMaghreb, esha: state.namazEsha, rooze: state.rooze },

          }

        setReports(newReports);
        setEditingReportId(null);

        sleepSlots: state.sleepSlots,
        items: state.items,

      }

      note: d.note || ''
    }));
    setEditingReportId(report.id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const getReportCode = (report) => {
    const d = report.details;
    const tempState = { ...getDefaultState(), ...d, items: d.items || getDefaultState().items, sleepSlots: d.sleepSlots || [{ sleep: '23:00', wake: '07:00' }] };
    const code = generateCode(tempState);
    alert('📋 کد رمزی این گزارش:\n\n' + code);
    return code;
  };

  const [showAnalysis, setShowAnalysis] = useState(false);
  const [filterPeriod, setFilterPeriod] = useState('month');
  const getFiltered = useCallback((period) => {
    const now = Date.now();
    let cutoff = 0;
    if (period === 'week') cutoff = now - 7 * 24 * 60 * 60 * 1000;
    else if (period === 'month') cutoff = now - 30 * 24 * 60 * 60 * 1000;
    else cutoff = 0;
    return reports.filter(r => r.id >= cutoff);
  }, [reports]);

  const filtered = getFiltered(filterPeriod);
  const sorted = [...filtered].sort((a, b) => a.id - b.id);

  const secPerc = sorted.map(r => ({
    date: r.date,
    علمی: Math.min(100, Math.round((r.sections.scientific.score / r.sections.scientific.max) * 100)),
    تهذیب: Math.min(100, Math.round((r.sections.tahzib.score / r.sections.tahzib.max) * 100)),
    بصیرت: Math.min(100, Math.round((r.sections.basirat.score / r.sections.basirat.max) * 100)),
    نظم: Math.min(100, Math.round((r.sections.organization.score / r.sections.organization.max) * 100))
  }));
  const sciRaw = sorted.map(r => ({ date: r.date, نمره: r.sections.scientific.score }));
  const tahRaw = sorted.map(r => ({ date: r.date, نمره: r.sections.tahzib.score }));
  const basRaw = sorted.map(r => ({ date: r.date, نمره: r.sections.basirat.score }));
  const orgRaw = sorted.map(r => ({ date: r.date, نمره: r.sections.organization.score }));

  const adaye = { صبح: 0, ظهر: 0, عصر: 0, مغرب: 0, عشا: 0, روزه: 0 };
  sorted.forEach(r => {
    const ad = r.details?.adayeDin;
    if (ad) {
      if (ad.sobh) adaye.صبح++;
      if (ad.zohr) adaye.ظهر++;
      if (ad.asr) adaye.عصر++;
      if (ad.maghreb) adaye.مغرب++;
      if (ad.esha) adaye.عشا++;
      if (ad.rooze) adaye.روزه++;
    }
  });

  const SimpleLine = ({ data, keys, colors, isPercent = false }) => {
    const ref = useRef(null);
    useEffect(() => {
      if (ref.current && data && data.length > 0) {
        const c = ref.current;
        const rect = c.parentElement.getBoundingClientRect();
        c.width = rect.width || 400;
        c.height = rect.height || 200;
        drawLine(c, data, keys, colors, isPercent);
      }
    }, [data, keys, colors, isPercent]);
    return <canvas ref={ref} className="w-full h-full" />;
  };

  const renderItems = useCallback((sectionId, items) => {
    const sectionState = state;
    const updateField = (field, value) => update(field, value);
    const isEdit = editMode[sectionId];
    return items.map((item, index) => {
      let component;
      const wrapWithEdit = (comp) => {
        if (isEdit) {
          return (
            <div key={item.id} className="item" style={{ borderBottom: '1px dashed #e2e8f0' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%' }}>
                <div className="order-btns">
                  <button onClick={() => moveItem(sectionId, index, -1)} disabled={index === 0}>▲</button>
                  <button onClick={() => moveItem(sectionId, index, 1)} disabled={index === items.length - 1}>▼</button>
                  <button onClick={() => deleteItem(sectionId, index, item.id)} style={{ background: '#fee2e2', color: '#dc2626' }}>✖</button>
                </div>
                <div style={{ flex: 1 }}>{comp}</div>
              </div>
            </div>
          );
        }
        return comp;
      };
      switch (item.type) {
        case 'checkbox':
          component = <CheckboxItem key={item.id} label={item.label} score={item.score} checked={sectionState[item.field] || false} onChange={() => updateField(item.field, !sectionState[item.field])} bonus={item.nature === 'bonus'} penalty={item.nature === 'penalty'} />;
          break;
        case 'toggleWithCheckbox':
          component = (
            <div key={item.id} className="card" style={{ background: '#f1f5f9', padding: '12px', margin: '8px 0' }}>
              <div className="item"><label><input type="checkbox" checked={sectionState[item.field] || false} onChange={() => updateField(item.field, !sectionState[item.field])} /> {item.label} {item.nature === 'bonus' && <span className="bonus">تشویقی</span>}{item.nature === 'penalty' && <span className="penalty">منفی</span>}</label></div>
              {sectionState[item.field] && <div className="item"><label><input type="checkbox" checked={sectionState[item.scoreField] || false} onChange={() => updateField(item.scoreField, !sectionState[item.scoreField])} /> دریافت امتیاز ({item.score})</label></div>}
            </div>
          );
          break;
        case 'slider': {
          const handler = item.handler || ((v) => parseInt(v));
          component = <SliderItem key={item.id} label={item.label} min={item.min} max={item.max} step={item.step} val={sectionState[item.field] || 0} onChange={(e) => updateField(item.field, handler(e.target.value))} extra={item.extra || ''} nature={item.nature} />;
          break;
        }
        case 'penaltyCounter':
          component = <PenaltyCounter key={item.id} label={item.label} value={sectionState[item.field] !== undefined ? sectionState[item.field] : item.maxScore} maxScore={item.maxScore} onChange={(v) => updateField(item.field, v)} />;
          break;
        case 'toggleWithSlider':
          component = (
            <div key={item.id} className="card" style={{ background: '#f1f5f9', padding: '12px', margin: '8px 0' }}>
              <div className="item"><label><input type="checkbox" checked={sectionState[item.field] || false} onChange={() => updateField(item.field, !sectionState[item.field])} /> {item.label} {item.nature === 'bonus' && <span className="bonus">تشویقی</span>}{item.nature === 'penalty' && <span className="penalty">منفی</span>}</label></div>
              {sectionState[item.field] && <SliderItem label="امتیاز" min={item.min} max={item.max} step={item.step} val={sectionState[item.scoreField] || 0} onChange={(e) => updateField(item.scoreField, parseInt(e.target.value))} />}
            </div>
          );
          break;
        case 'adayeDin':
          component = (
            <div key={item.id} className="card" style={{ background: '#f1f5f9', padding: '12px', margin: '8px 0' }}>
              <div className="item"><label><input type="checkbox" checked={sectionState[item.field] || false} onChange={() => updateField(item.field, !sectionState[item.field])} /> {item.label}</label></div>
              {sectionState[item.field] && (
                <div className="grid-2 sub-items">
                  <CheckboxItem label="نماز صبح" score={0} checked={sectionState.namazSobh || false} onChange={() => updateField('namazSobh', !sectionState.namazSobh)} />
                  <CheckboxItem label="نماز ظهر" score={0} checked={sectionState.namazZohr || false} onChange={() => updateField('namazZohr', !sectionState.namazZohr)} />
                  <CheckboxItem label="نماز عصر" score={0} checked={sectionState.namazAsr || false} onChange={() => updateField('namazAsr', !sectionState.namazAsr)} />
                  <CheckboxItem label="نماز مغرب" score={0} checked={sectionState.namazMaghreb || false} onChange={() => updateField('namazMaghreb', !sectionState.namazMaghreb)} />
                  <CheckboxItem label="نماز عشا" score={0} checked={sectionState.namazEsha || false} onChange={() => updateField('namazEsha', !sectionState.namazEsha)} />
                  <CheckboxItem label="روزه" score={0} checked={sectionState.rooze || false} onChange={() => updateField('rooze', !sectionState.rooze)} />
                </div>
              )}
            </div>
          );
          break;
        default: component = null;
      }
      return wrapWithEdit(component);
    });
  }, [state, editMode, update, moveItem, deleteItem]);

  const handleSignOut = () => {
    if (window.confirm('آیا مطمئن هستید که می‌خواهید از حساب خود خارج شوید؟')) {
      auth.signOut();
      setUser(null);
    }
  };

  if (loading) return <div className="loading">⏳ در حال بارگذاری...</div>;
  if (error) return <div className="error-box">❌ خطا: {error}<br /><button className="btn btn-blue" style={{marginTop:'12px', minWidth:'auto', padding:'8px 20px'}} onClick={() => window.location.reload()}>تلاش مجدد</button></div>;
  if (!user) return <Login onLogin={() => setUser(auth.currentUser)} />;

  return (
    <div className="container">
      <div className="header">
        <div className="header-left">
          <h1>داشبورد خودسازی</h1>
          <span className="user-email">👤 {user.email}</span>
        </div>
        <div className="score-wrap">
          <div className="score-num">{total}</div>
          <div className="score-max">از {totalMax}</div>
        </div>
      </div>

      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
          <span style={{ fontWeight: 700, fontSize: '18px', color: '#1e293b' }}>🛏️ ساعت‌های خوابیدن</span>
          <span style={{ fontSize: '0.8rem', color: '#94a3b8' }}>{state.sleepSlots.length} بازه</span>
        </div>
        <SleepSlotManager slots={state.sleepSlots} onChange={(newSlots) => update('sleepSlots', newSlots)} />
      </div>

      <Section id="scientific" title="۱. علمی" score={scientific.score} max={scientific.max} open={open} onToggle={() => toggle('scientific')}>
        {renderItems('scientific', state.items.scientific)}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '12px', gap: '8px', flexWrap: 'wrap' }}>
          <button className="btn-sm" onClick={() => toggleEdit('scientific')}>{editMode.scientific ? '✔ ذخیره ترتیب' : '✏️ ویرایش'}</button>
          <button className="btn-sm" style={{ background: '#2563eb', color: '#fff' }} onClick={() => openAddModal('scientific')}>➕ افزودن</button>
        </div>
      </Section>

      <Section id="tahzib" title="۲. تهذیب" score={tahzib.score} max={tahzib.max} open={open} onToggle={() => toggle('tahzib')}>
        {renderItems('tahzib', state.items.tahzib)}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '12px', gap: '8px', flexWrap: 'wrap' }}>
          <button className="btn-sm" onClick={() => toggleEdit('tahzib')}>{editMode.tahzib ? '✔ ذخیره ترتیب' : '✏️ ویرایش'}</button>
          <button className="btn-sm" style={{ background: '#2563eb', color: '#fff' }} onClick={() => openAddModal('tahzib')}>➕ افزودن</button>
        </div>
      </Section>

      <Section id="basirat" title="۳. بصیرت" score={basirat.score} max={basirat.max} open={open} onToggle={() => toggle('basirat')}>
        {renderItems('basirat', state.items.basirat)}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '12px', gap: '8px', flexWrap: 'wrap' }}>
          <button className="btn-sm" onClick={() => toggleEdit('basirat')}>{editMode.basirat ? '✔ ذخیره ترتیب' : '✏️ ویرایش'}</button>
          <button className="btn-sm" style={{ background: '#2563eb', color: '#fff' }} onClick={() => openAddModal('basirat')}>➕ افزودن</button>
        </div>
      </Section>

      <Section id="organization" title="۴. نظم زندگی" score={organization.score} max={organization.max} open={open} onToggle={() => toggle('organization')}>
        {renderItems('organization', state.items.organization)}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '12px', gap: '8px', flexWrap: 'wrap' }}>
          <button className="btn-sm" onClick={() => toggleEdit('organization')}>{editMode.organization ? '✔ ذخیره ترتیب' : '✏️ ویرایش'}</button>
          <button className="btn-sm" style={{ background: '#2563eb', color: '#fff' }} onClick={() => openAddModal('organization')}>➕ افزودن</button>
        </div>
        <div className="mt-4">
          <label style={{ fontWeight: 700, fontSize: '14px', display: 'block', marginBottom: '4px' }}>📝 یادداشت روزانه</label>
          <textarea className="note-field" placeholder="هر نکته یا اتفاقی که امروز می‌خواهید ثبت کنید..." value={state.note || ''} onChange={(e) => update('note', e.target.value)} />
        </div>
      </Section>

      <div className="btn-wrap">
        <button className="btn btn-green" onClick={saveReport}>{editingReportId ? '💾 ذخیره ویرایش' : 'ذخیره گزارش روزانه'}</button>
        <button className="btn btn-blue" onClick={() => setShowAnalysis(!showAnalysis)} style={{ minWidth: '140px' }}>{showAnalysis ? 'بستن تحلیل' : 'تحلیل عملکرد'}</button>
        <button className="btn btn-red" onClick={handleSignOut}>🚪 خروج</button>
      </div>

      {showAnalysis && (
        <div className="card analysis-content">
          <h3 style={{ fontSize: '20px', fontWeight: 900, color: '#1e40af', marginBottom: '12px', borderRight: '4px solid #3b82f6', paddingRight: '12px' }}>تحلیل عملکرد</h3>
          <div className="filter-wrap">
            <button className={`filter-btn ${filterPeriod === 'week' ? 'active' : ''}`} onClick={() => setFilterPeriod('week')}>هفته</button>
            <button className={`filter-btn ${filterPeriod === 'month' ? 'active' : ''}`} onClick={() => setFilterPeriod('month')}>ماه</button>
            <button className={`filter-btn ${filterPeriod === 'all' ? 'active' : ''}`} onClick={() => setFilterPeriod('all')}>کل</button>
          </div>
          {filtered.length === 0 ? <div className="empty">داده‌ای برای این بازه وجود ندارد.</div> : (
            <>
              <h4 style={{ fontWeight: 700, marginBottom: '8px' }}>مقایسه درصدی شاخه‌ها</h4>
              <div className="chart-box"><SimpleLine data={secPerc} keys={['علمی', 'تهذیب', 'بصیرت', 'نظم']} colors={['#4f46e5', '#10b981', '#f59e0b', '#ef4444']} isPercent={true} /></div>
              <div className="grid-2 mt-4">
                <div><h5 style={{ fontWeight: 700 }}>روند علمی (نمره خام)</h5><div className="chart-box" style={{ height: '180px' }}><SimpleLine data={sciRaw} keys={['نمره']} colors={['#4f46e5']} /></div></div>
                <div><h5 style={{ fontWeight: 700 }}>روند تهذیب (نمره خام)</h5><div className="chart-box" style={{ height: '180px' }}><SimpleLine data={tahRaw} keys={['نمره']} colors={['#10b981']} /></div></div>
                <div><h5 style={{ fontWeight: 700 }}>روند بصیرت (نمره خام)</h5><div className="chart-box" style={{ height: '180px' }}><SimpleLine data={basRaw} keys={['نمره']} colors={['#f59e0b']} /></div></div>
                <div><h5 style={{ fontWeight: 700 }}>روند نظم (نمره خام)</h5><div className="chart-box" style={{ height: '180px' }}><SimpleLine data={orgRaw} keys={['نمره']} colors={['#ef4444']} /></div></div>
              </div>
              <h4 style={{ fontWeight: 700, marginTop: '16px' }}>فراوانی ادای دین</h4>
              <div className="adaye-box">
                <span>نماز صبح: <span className="count">{adaye.صبح}</span></span>
                <span>نماز ظهر: <span className="count">{adaye.ظهر}</span></span>
                <span>نماز عصر: <span className="count">{adaye.عصر}</span></span>
                <span>نماز مغرب: <span className="count">{adaye.مغرب}</span></span>
                <span>نماز عشا: <span className="count">{adaye.عشا}</span></span>
                <span>روزه: <span className="count">{adaye.روزه}</span></span>
              </div>
              <div className="grid-2 mt-4">
                <div className="card" style={{ background: '#f1f5f9', padding: '12px' }}>
                  <p style={{ color: '#64748b' }}>میانگین امتیاز کل</p>
                  <p style={{ fontSize: '24px', fontWeight: 900, color: '#2563eb' }}>{Math.round(filtered.reduce((s, r) => s + r.totalScore, 0) / filtered.length)}</p>
                </div>
                <div className="card" style={{ background: '#f1f5f9', padding: '12px' }}>
                  <p style={{ color: '#64748b' }}>تعداد گزارش‌ها</p>
                  <p style={{ fontSize: '24px', fontWeight: 900, color: '#2563eb' }}>{filtered.length}</p>
                </div>
              </div>
            </>
          )}
        </div>
      )}

      <div className="card">
        <h3 style={{ fontSize: '18px', fontWeight: 900, color: '#1e40af', borderRight: '4px solid #3b82f6', paddingRight: '12px' }}>📋 گزارش‌های قبلی</h3>
        {reports.length === 0 ? <div className="empty">هنوز گزارشی ذخیره نشده است.</div> : 
          reports.map(r => (
            <div key={r.id} className="report-card">
              <div className="report-header">
                <div>
                  <span className="date" style={{ fontWeight: 700, fontSize: '16px' }}>{r.date}</span>
                  <span className="score" style={{ fontWeight: 700, color: '#2563eb', marginRight: '12px' }}>امتیاز: {r.totalScore} از {r.sections.scientific.max + r.sections.tahzib.max + r.sections.basirat.max + r.sections.organization.max}</span>
                </div>
                <button className="delete-btn" onClick={() => deleteReport(r.id, r.date)} title="حذف گزارش">🗑️</button>
              </div>
              {r.details?.note && (
                <div className="report-details" style={{ marginTop: '4px', padding: '8px 12px', background: '#fef9c3', borderRadius: '8px', fontSize: '14px' }}>
                  📝 {r.details.note}
                </div>
              )}
              <div className="report-actions">
                <button className="btn-sm" style={{ background: '#3b82f6', color: '#fff' }} onClick={() => editReport(r)}>✏️ ویرایش</button>
                <button className="btn-sm" style={{ background: '#8b5cf6', color: '#fff' }} onClick={() => getReportCode(r)}>🔑 کد رمزی</button>
              </div>
            </div>
          ))
        }
        <div style={{ marginTop: '16px', display: 'flex', justifyContent: 'center' }}>
          <button className="btn btn-red" onClick={clearAllData} style={{ minWidth: '200px' }}>🗑️ پاک کردن همه داده‌ها</button>
        </div>
      </div>

      <AddItemModal isOpen={showAddModal} onClose={() => setShowAddModal(false)} onAdd={handleAddItem} />
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
